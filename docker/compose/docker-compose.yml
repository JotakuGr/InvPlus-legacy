services:
  postgres:
    image: postgres:18
    container_name: invplus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: invplus
      POSTGRES_USER: invplus_user
      POSTGRES_PASSWORD: alpha_invplus
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - invplus_postgres_data:/var/lib/postgresql
    networks:
      - invplus_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: invplus-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@invplus.com
      PGADMIN_DEFAULT_PASSWORD: 40028922Jo$
    ports:
      - "8081:80"
    depends_on:
      - postgres
    networks:
      - invplus_network

  redis:
    image: redis:8
    container_name: invplus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - invplus_redis_data:/data
    networks:
      - invplus_network

  rabbitmq:
    image: rabbitmq:4.3.2-management-alpine
    container_name: invplus-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: invplus
      RABBITMQ_DEFAULT_PASS: instant_invplus
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - invplus_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - invplus_network

volumes:
  invplus_postgres_data:
  invplus_rabbitmq_data:
  invplus_redis_data:

networks:
  invplus_network:
    driver: bridge