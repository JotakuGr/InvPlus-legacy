spring:
  application:
    name: invplus-api

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: InvPlusHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    show-sql: false

    properties:
      "[hibernate.format_sql]": false
      "[hibernate.jdbc.batch_size]": 50
      "[hibernate.order_inserts]": true
      "[hibernate.order_updates]": true
  flyway:
    enabled: true
    locations: filesystem:../database/migrations
    baseline-on-migrate: true

server:
  port: 8080

invplus:
  security:
    jwt:
      secret: ${INVPLUS_JWT_SECRET}
      expiration-minutes: ${INVPLUS_JWT_EXPIRATION_MINUTES:60}
      refresh-expiration-days: ${INVPLUS_JWT_REFRESH_EXPIRATION_DAYS:7}
  storage:
    provider: ${INVPLUS_STORAGE_PROVIDER:LOCAL}
    local-path: ${INVPLUS_STORAGE_LOCAL_PATH:./uploads}
    public-base-url: ${INVPLUS_STORAGE_PUBLIC_BASE_URL:http://localhost:8080/uploads}
  cdn:
    enabled: ${INVPLUS_CDN_ENABLED:false}
    base-url: ${INVPLUS_CDN_BASE_URL:http://localhost:8080/uploads}
