spring:
  application:
    name: invplus-api

  datasource:
    url: jdbc:postgresql://localhost:5432/invplus
    username: invplus_user
    password: invplus_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      "[hibernate.format_sql]": true

  flyway:
    enabled: true
    locations: filesystem:../database/migrations
    baseline-on-migrate: true

server:
  port: 8080