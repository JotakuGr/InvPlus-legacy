spring:
  cache:
    type: simple

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/invplus}
    username: ${SPRING_DATASOURCE_USERNAME:invplus_user}
    password: ${SPRING_DATASOURCE_PASSWORD:alpha_invplus}

invplus:
  security:
    jwt:
      secret: ${INVPLUS_JWT_SECRET:invplus-test-secret-change-me-please-32bytes}
      refresh-expiration-days: ${INVPLUS_JWT_REFRESH_EXPIRATION_DAYS:7}
  storage:
    provider: ${INVPLUS_STORAGE_PROVIDER:LOCAL}
    local-path: ${INVPLUS_STORAGE_LOCAL_PATH:./target/test-uploads}
    public-base-url: ${INVPLUS_STORAGE_PUBLIC_BASE_URL:http://localhost:8080/uploads}

  cdn:
    enabled: ${INVPLUS_CDN_ENABLED:false}
    base-url: ${INVPLUS_CDN_BASE_URL:http://localhost:8080/uploads}
